<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eli's World · Personal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fredoka:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="app">
 <aside><div class="logo"><i><img data-logo alt=""></i><div><b>Eli's World</b><span>Personal Planner</span></div></div><nav id="nav" aria-label="Main"></nav><div class="art"></div></aside>
 <main>
  <header class="hero">
   <div class="bar-top">
    <div class="brand"><img data-logo alt=""><b>Eli's World</b></div><div id="greet"></div>
    <div class="tools"><div class="dt" id="dt"></div>
     <div class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search tasks, classes, projects..." autocomplete="off" aria-label="Search"><kbd>/</kbd><div id="res"></div></div>
     <button class="bell" data-a="tab" data-id="Reminders" aria-label="Reminders"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9 M13.7 21a2 2 0 0 1-3.4 0"/></svg><b id="badge"></b></button>
     <img class="av" data-logo alt="Eli's World profile">
    </div>
   </div>
   <div id="cards"></div>
  </header>
  <div id="toasts"></div>
  <div id="view"></div>
 </main>
</div>
<script src="assets.js"></script>
<script src="app.js"></script>
<script src="ai.js"></script>
<script src="world.js"></script>
<script src="themes.js"></script>
